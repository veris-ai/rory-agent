[project]
name = "rory-elevenlabs-realtime"
version = "0.1.0"
description = "Rory on ElevenLabs Realtime over the voice_ws channel, using rory-core's shared tools and prompt."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_elevenlabs_realtime"]
