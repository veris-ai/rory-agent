[project]
name = "rory-cartesia"
version = "0.1.0"
description = "Rory on Cartesia Managed Agents over Veris's voice_ws channel: the webhook tools created once per pod, an agent per call, audio relayed over the agent WebSocket. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=14",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_cartesia"]
