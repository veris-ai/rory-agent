[project]
name = "rory-fluxions"
version = "0.1.0"
description = "Rory on the Fluxions voice-agent API — one realtime websocket carrying ASR, LLM and VUI TTS, with Rory's tools as bring-your-own functions, bridged onto Veris's voice_ws channel. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14",
    "httpx>=0.27",
    "audioop-lts; python_version >= '3.13'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_fluxions"]
