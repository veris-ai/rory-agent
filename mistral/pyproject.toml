[project]
name = "rory-mistral"
version = "0.1.0"
description = "Rory on mistral over Veris's voice_ws channel. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core[vad]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mistralai[realtime]>=2.9",
    "numpy>=2.0",
    "audioop-lts; python_version >= '3.13'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_mistral"]
