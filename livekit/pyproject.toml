[project]
name = "rory-livekit"
version = "0.1.0"
description = "Rory on livekit over Veris's voice_ws channel. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "livekit-agents>=1.5,<2",
    "livekit-api>=1.0",
    "livekit-plugins-openai>=1.5,<2",
    "livekit-plugins-deepgram>=1.5,<2",
    "livekit-plugins-elevenlabs>=1.5,<2",
    "livekit-plugins-silero>=1.5,<2",
    "openai>=2.38.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_livekit"]
