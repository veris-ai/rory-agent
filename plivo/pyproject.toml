[project]
name = "rory-plivo"
version = "0.1.0"
description = "Rory on Plivo — the Pipecat cascade (Deepgram STT + gpt-4.1-mini + ElevenLabs TTS) answering a real Plivo call over Plivo Audio Streaming, with the caller bridged in as a Plivo WebRTC endpoint. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "pipecat-ai[openai,deepgram,elevenlabs,silero]>=1.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "aiortc>=1.13",
    "av>=14",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_plivo"]
