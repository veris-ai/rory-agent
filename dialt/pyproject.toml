[project]
name = "rory-dialt"
version = "0.1.0"
description = "Rory on Dialt Fast or Dialt Smart over Veris voice_ws."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "audioop-lts; python_version >= '3.13'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_dialt"]
