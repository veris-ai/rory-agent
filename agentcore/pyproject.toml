[project]
name = "rory-agentcore"
version = "0.1.0"
description = "Rory on Amazon Connect's voice stack: Lex for speech-to-text, Bedrock AgentCore Runtime for the reasoning loop, Polly for speech. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core[vad]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "boto3>=1.40",
    "aws-sdk-lex-runtime-v2>=0.12",
    "awscrt>=0.27",
    "opentelemetry-api>=1.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "opentelemetry-sdk>=1.27"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_agentcore"]
