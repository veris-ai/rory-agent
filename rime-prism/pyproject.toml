[project]
name = "rory-rime-prism"
version = "0.1.0"
description = "Rory on Rime's Prism speech-to-speech model through the Rime Python SDK. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "rimelabs-sdk==0.1.0a25",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_rime_prism"]
