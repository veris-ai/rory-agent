[project]
name = "rory-huggingface"
version = "0.1.0"
description = "Rory on Hugging Face's speech-to-speech cascade — hosted Whisper STT, an open LLM via the router's chat completions, hosted Kokoro TTS — assembled into a turn-taking loop over Veris's voice_ws channel. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core[vad]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "openai>=1.50",
    "audioop-lts; python_version >= '3.13'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_huggingface"]
