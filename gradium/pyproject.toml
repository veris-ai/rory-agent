[project]
name = "rory-gradium"
version = "0.1.0"
description = "Rory on gradbot over Veris's voice_ws channel: Gradium streaming STT and TTS around an OpenAI-compatible LLM, multiplexed in-process by gradbot's Rust engine. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gradbot>=0.2,<0.3",
    # audioop left the stdlib in 3.13; this is the same module, unvendored.
    "audioop-lts; python_version >= '3.13'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_gradium"]
