[project]
name = "rory-polyai-dialog-rsn-1"
version = "0.1.0"
description = "Rory on PolyAI's Dialog-RSN-1 realtime API over the voice_ws channel. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 14 renamed connect()'s extra_headers to additional_headers.
    "websockets>=14",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_polyai_dialog_rsn_1"]
