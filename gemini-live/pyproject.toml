[project]
name = "rory-gemini-live"
version = "0.1.0"
description = "Rory on the Gemini Live API — speech-to-speech, server-to-server, over Veris's voice_ws channel. The transport only: the tools and the vendor clients live in rory-core."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rory-core",
    "google-genai>=1.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "audioop-lts; python_version >= '3.13'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rory_gemini_live"]
